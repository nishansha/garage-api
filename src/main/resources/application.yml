spring:
  application:
    name: garage
  profiles:
    default: dev
    group:
      dev: minio
      prod: minio
  modulith:
    detection-strategy: explicitly-annotated
  datasource:
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: appdbpool
      minimum-idle: 5
      maximum-pool-size: 15
      keepalive-time: 300000
      max-lifetime: 1800000
      connection-timeout: 60000
      validation-timeout: 30000
      leak-detection-threshold: 30000
      initialization-fail-timeout: 1
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
  cache:
    type: caffeine
    cache-names: productCategories,productSegments,productBrands,productModels,productVarients
    caffeine:
      spec: maximumSize=500,expireAfterWrite=30m
  jpa:
#    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        cache:
          use_second_level_cache: false
          use_query_cache: false
      org:
        hibernate:
          envers:
            audit_table_suffix: _aud
            revision_field_name: rev
            revision_type_field_name: revtype
            store_data_at_delete: true
    hibernate:
      ddl-auto: none
      default_schema:
      enable_lazy_load_no_trans: true
      use-new-id-generator-mappings: false
      order_inserts: true
      order_updates: true
      jdbc.batch_size: 100
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      # generate_statistics: true   # pair with logging.level.org.hibernate.stat: DEBUG above

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Token TTL policy — not environment-specific, same in dev/prod.
app:
  jwt:
    expiration-ms: 3600000
    refresh-token:
      expiration-ms: 86400000
